name: Build EXE
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: citations-exe
          path: dist/Citations.exe
